name: Build Mumla APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.1.8937393
      ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/25.1.8937393
    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK & NDK
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses > /dev/null
          sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.1.8937393"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          SP_DIR="libraries/humla/libs/humla-spongycastle"
          for mod in prov pkix; do
            OUT_JAR="$SP_DIR/$mod/build/libs/$mod-1.51.0.0.jar"
            mkdir -p "$(dirname "$OUT_JAR")" "/tmp/sp_build/$mod/classes"
            if [ ! -f "$OUT_JAR" ]; then
              SRCS=$(find "$SP_DIR/$mod/src" "$SP_DIR/core/src" -name "*.java" 2>/dev/null || true)
              if [ -n "$SRCS" ]; then
                javac -source 1.8 -target 1.8 -Xlint:-options -d "/tmp/sp_build/$mod/classes" $SRCS || true
              fi
              jar cf "$OUT_JAR" -C "/tmp/sp_build/$mod/classes" .
            fi
          done
          ./gradlew assembleDebug -Pandroid.enableJetifier=false --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mumla-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          
