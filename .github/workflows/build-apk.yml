name: Build Mumla APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.1.8937393
      ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/25.1.8937393
    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK & NDK
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses > /dev/null
          sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.1.8937393"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          ls -la libraries/humla/libs/humla-spongycastle || true
          if [ -f "libraries/humla/libs/humla-spongycastle/gradlew" ]; then
            chmod +x libraries/humla/libs/humla-spongycastle/gradlew
            (cd libraries/humla/libs/humla-spongycastle && ./gradlew jar --stacktrace || ./gradlew build --stacktrace || true)
          elif [ -f "libraries/humla/libs/humla-spongycastle/build.gradle" ]; then
            gradle -p libraries/humla/libs/humla-spongycastle jar --stacktrace || gradle -p libraries/humla/libs/humla-spongycastle build --stacktrace || true
          fi
          ./gradlew assembleDebug -Pandroid.enableJetifier=false --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mumla-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          
