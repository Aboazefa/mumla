name: Build Mumla APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/25.1.8937393
      ANDROID_NDK_ROOT: /usr/local/lib/android/sdk/ndk/25.1.8937393
    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        id: setup-java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Android SDK & NDK
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -sSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses > /dev/null
          sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.1.8937393"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Download SpongyCastle JARs and Build Debug APK
        run: |
          export JAVA_HOME="${{ steps.setup-java.outputs.path }}"
          export PATH="$JAVA_HOME/bin:$PATH"
          java -version
          ./gradlew --stop || true
          SP_DIR="libraries/humla/libs/humla-spongycastle"
          mkdir -p "$SP_DIR/prov/build/libs" "$SP_DIR/pkix/build/libs"
          curl -fSL "https://repo1.maven.org/maven2/com/madgag/spongycastle/prov/1.51.0.0/prov-1.51.0.0.jar" -o "$SP_DIR/prov/build/libs/prov-1.51.0.0.jar"
          curl -fSL "https://repo1.maven.org/maven2/com/madgag/spongycastle/pkix/1.51.0.0/pkix-1.51.0.0.jar" -o "$SP_DIR/pkix/build/libs/pkix-1.51.0.0.jar"
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.java.home="$JAVA_HOME" -Pandroid.enableJetifier=false --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mumla-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          
